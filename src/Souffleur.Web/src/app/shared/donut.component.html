<div class="flex flex-col items-center">
  <div class="relative size-32">
    <!-- Fuer Hilfsmittel unsichtbar: Die Legende darunter sagt dasselbe als
         Text, und zweimal dasselbe vorzulesen hilft niemandem. -->
    <svg viewBox="0 0 42 42" class="size-full" aria-hidden="true">
      <circle
        cx="21"
        cy="21"
        [attr.r]="radius"
        fill="none"
        stroke="var(--color-surface-sunken)"
        stroke-width="3.6"
      />
      @for (arc of arcs(); track arc.label) {
        <circle
          cx="21"
          cy="21"
          [attr.r]="radius"
          fill="none"
          [attr.stroke]="arc.color"
          stroke-width="3.6"
          [attr.stroke-dasharray]="arc.dash"
          [attr.stroke-dashoffset]="arc.offset"
        ></circle>
      }
    </svg>

    <div class="pointer-events-none absolute inset-0 grid place-content-center text-center">
      <strong class="font-display text-xl font-bold leading-none">{{ center() }}</strong>
      <span
        class="mx-auto mt-1 block max-w-20 text-[10px] leading-tight text-balance text-content-muted"
      >
        {{ centerNote() }}
      </span>
    </div>
  </div>

  <ul class="mt-3 flex w-full list-none flex-col gap-1 p-0">
    @for (segment of shown(); track segment.label) {
      <li class="flex items-baseline gap-2 text-xs">
        <span
          aria-hidden="true"
          class="size-2 shrink-0 translate-y-px rounded-full"
          [style.background]="segment.color"
        ></span>
        <span class="min-w-0 flex-1 truncate text-content">{{ segment.label }}</span>
        <span class="shrink-0 text-content-muted tabular">{{ segment.text }}</span>
        <span class="w-11 shrink-0 whitespace-nowrap text-right text-content-faint tabular">{{
          segment.share
        }}</span>
      </li>
    }
  </ul>
</div>

<ul class="flex list-none flex-col gap-2.5 p-0">
  @for (row of rows(); track row.label) {
    <li>
      <div class="flex items-baseline justify-between gap-2 text-xs">
        <span class="min-w-0 truncate text-content">{{ row.label }}</span>
        <span class="shrink-0 text-content-muted tabular">{{ row.text }}</span>
      </div>
      <div class="mt-1 h-2 w-full rounded bg-surface-sunken">
        <div
          class="h-full rounded"
          [style.width.%]="row.percent"
          [style.background]="row.color"
        ></div>
      </div>
    </li>
  }
</ul>

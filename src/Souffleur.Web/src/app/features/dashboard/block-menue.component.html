<button
  type="button"
  (click)="umschalten()"
  [attr.aria-expanded]="offen()"
  aria-haspopup="menu"
  [attr.aria-label]="label() + ': weitere Einstellungen'"
  title="Weitere Einstellungen"
  class="grid size-6 cursor-pointer place-items-center rounded-md border-0 bg-transparent text-content-faint hover:text-content"
>
  <souffleur-icon name="mehr" [size]="14" />
</button>

@if (offen()) {
  <div
    role="menu"
    [attr.aria-label]="label()"
    class="absolute right-0 top-full z-50 mt-1 w-48 overflow-hidden rounded-lg border border-border bg-surface-raised text-content shadow-xl"
  >
    <button
      type="button"
      role="menuitem"
      (click)="waehle('oben')"
      [disabled]="erster()"
      class="flex w-full cursor-pointer items-center gap-2 border-0 bg-transparent px-3 py-2 text-left text-sm hover:bg-surface-sunken disabled:cursor-default disabled:text-content-faint"
    >
      <souffleur-icon name="pfeil-auf" [size]="14" />
      Nach oben
    </button>
    <button
      type="button"
      role="menuitem"
      (click)="waehle('unten')"
      [disabled]="letzter()"
      class="flex w-full cursor-pointer items-center gap-2 border-0 bg-transparent px-3 py-2 text-left text-sm hover:bg-surface-sunken disabled:cursor-default disabled:text-content-faint"
    >
      <souffleur-icon name="pfeil-ab" [size]="14" />
      Nach unten
    </button>
    <button
      type="button"
      role="menuitem"
      (click)="waehle('aus')"
      class="flex w-full cursor-pointer items-center gap-2 border-t border-border bg-transparent px-3 py-2 text-left text-sm hover:bg-surface-sunken"
    >
      <span class="grid size-3.5 place-items-center" aria-hidden="true">–</span>
      Ausblenden
    </button>
  </div>
}
